services:
  - type: web
    name: saas-turnos-backend
    env: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: FRONTEND_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        value: "TEST-TOKEN-DEMO"
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
