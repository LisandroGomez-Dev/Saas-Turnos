server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: saas-turnos-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/turnos_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:TEST-TOKEN-DEV}
  webhook:
    secret: ${MP_WEBHOOK_SECRET:dev_webhook_secret_key_hmac}
  notification-url: ${MP_NOTIFICATION_URL:http://localhost:8080/api/v1/pagos/mercadopago/webhook}

turnos:
  reserva:
    expiracion-minutos: 10

